[project]
name = "neo-personal-bot"
version = "0.1.0"
description = "个人化的可自定义工作团队：角色路由，再派给 neo cloud agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neo-personal-bot = "neo_personal_bot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neo_personal_bot = ["exhibit.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
